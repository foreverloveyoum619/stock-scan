name: scan
on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
concurrency: scan
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scan.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add result.json
          [ -f universe_cache.json ] && git add universe_cache.json || true
          git diff --cached --quiet || (git commit -m "scan" && git push)
